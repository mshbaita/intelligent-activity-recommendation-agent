name: Temporary NLLB model fetch

on:
  push:
    branches:
      - chatgpt-temp-fetch-nllb
    paths:
      - .github/workflows/fetch-nllb.yml

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download CTranslate2 NLLB files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nllb-200-600m
          base="https://huggingface.co/JustFrederik/nllb-200-distilled-600M-ct2-int8/resolve/main"
          curl -fL --retry 5 --retry-delay 5 "$base/model.bin?download=true" -o nllb-200-600m/model.bin
          curl -fL --retry 5 --retry-delay 5 "$base/config.json?download=true" -o nllb-200-600m/config.json
          curl -fL --retry 5 --retry-delay 5 "$base/shared_vocabulary.txt?download=true" -o nllb-200-600m/shared_vocabulary.txt
          curl -fL --retry 5 --retry-delay 5 "$base/sentencepiece.bpe.model?download=true" -o nllb-200-600m/sentencepiece.bpe.model
          echo "ed1beaf75134de7505315a5223162f56acff397eff6b50638a500d3936fe707b  nllb-200-600m/model.bin" > checksums.txt
          echo "0c2f6fa2057c7264d052fb4a62ba3476eeae70487acddfa8e779a53a00cbf44c  nllb-200-600m/config.json" >> checksums.txt
          echo "a132a83330f45514c2476eb81d1d69b3c41762264d16ce0a7ea982e5d6c728e5  nllb-200-600m/shared_vocabulary.txt" >> checksums.txt
          echo "14bb8dfb35c0ffdea7bc01e56cea38b9e3d5efcdcb9c251d6b40538e1aab555a  nllb-200-600m/sentencepiece.bpe.model" >> checksums.txt
          sha256sum -c checksums.txt
          du -sh nllb-200-600m

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: nllb-200-600m-ct2-int8
          path: nllb-200-600m
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
