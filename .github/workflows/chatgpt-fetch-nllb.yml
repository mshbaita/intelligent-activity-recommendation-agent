name: ChatGPT temporary NLLB model bundle

on:
  push:
    branches:
      - chatgpt-temp-fetch-nllb
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-model-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Set up Python 3.12 for model conversion
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conversion tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "transformers<5" torch sentencepiece protobuf ctranslate2 huggingface_hub

      - name: Download and convert NLLB to CTranslate2 int8
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="facebook/nllb-200-distilled-600M",
              local_dir="hf_nllb",
          )
          PY
          ct2-transformers-converter \
            --model hf_nllb \
            --output_dir nllb_ct2_int8 \
            --quantization int8 \
            --copy_files tokenizer.json tokenizer_config.json special_tokens_map.json sentencepiece.bpe.model
          du -sh nllb_ct2_int8
          find nllb_ct2_int8 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Build Python 3.13 helper wheels
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Package helper wheels
        run: |
          python -m pip install --upgrade pip wheel
          mkdir -p wheels
          python -m pip wheel sentencepiece langid -w wheels
          find wheels -type f -printf '%f %s bytes\n' | sort

      - name: Write bundle manifest
        run: |
          {
            echo "Public model: facebook/nllb-200-distilled-600M"
            echo "Conversion: CTranslate2 int8"
            echo "Purpose: temporary local document translation"
            echo "No user document content was uploaded to this workflow."
          } > BUNDLE_INFO.txt
          sha256sum nllb_ct2_int8/* wheels/* > SHA256SUMS.txt

      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: nllb-ct2-int8-python313
          path: |
            nllb_ct2_int8
            wheels
            BUNDLE_INFO.txt
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
